[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moment-intelligence"
version = "0.1.0"
description = "WhereWeGo / Moment Intelligence: discovery backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "apps/api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "apps/api"]
packages = ["moment_intelligence", "app"]
plugins = ["pydantic.mypy"]
